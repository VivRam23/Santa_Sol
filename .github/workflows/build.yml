name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile yet: the first green run on GitHub creates the dependency tree.
      # TODO(deps): commit package-lock.json after the first local `npm install`, then switch this to `npm ci`.
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Check every placeholder is still listed
        run: |
          echo "Staging markers left on the page:"
          grep -o '\[\(TBD\|NEEDS PROOF\|ASSUMPTION\|PHOTO TO ADD\|LOGO TO ADD\)[^]]*\]' dist/index.html | sort | uniq -c || true
